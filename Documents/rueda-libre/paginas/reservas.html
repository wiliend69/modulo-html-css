<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Libre | Reservas</title>
    <link rel="stylesheet" href="../css/style.css">
    
</head>
<body>
  <main>
    <section>
        <header>
        <h1>Rueda Libre</h1>
            <img src="../img/istockphoto-543977438-612x612.jpg" alt="Rueda libre" width="200">
            <nav>
                <a href="../html/index.html">Inicio</a>
                <a href="tarifa.html">Tarifas</a>
            </nav>
        </header><br>
    </section>
    <section>
        <table border="1"> 
            <caption><h2>Reserva tu bicicleta</h2></caption>
            <thead>
                <tr>
                    <th scope= "col">Dia</th>
                    <th scope= "col">Horario</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Lunes a Viernes</td><td>7 am a 7 pm</td></tr>
                <tr><td>Sabado, Domingo y festivos </td><td>6 am a 2 pm</td></tr>
            </tbody>
        </table><br>
    </section>
        <form action="../html/index.html" method="get">
             <fieldset>
            <fieldset>
                <legend>Tus datos</legend>
                <p>
                    <label for="nombre">*Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>
                <p>
                    <label for="docu">*Numero de documento</label>
                    <input type="number" id="docu" name="docu" minlength="6" maxlength="10" required>
                </p>
                <p>
                    <label for="correo">*Correo electronico:</label>
                    <input type="email" id="correo" name="correo" required>
                </p>
                <p>
                    <label for="celu">*Celular (Tiene que empezar por 3)</label>
                    <input type="tel" id="celu" name="celu"  pattern="3[0-9]{5,9}" required>
                </p>
            </fieldset>
            <fieldset>
                <legend>Tu alquiler</legend>
                
                  <p>
                      <label for="alqui">*Fecha de alquiler (Nov 1 - Dic 02 | 2026):</label>
                    <input type="date" id="alqui" name="alqui" min="2026-11-01" max="2026-12-02" required>
                  </p>
                
                  <p>
                      <label for="tipo">Tipo de bicicleta</label>
                    <select name="tipo" id="tipo" required>
                        <option value="urban">Urbana</option>
                        <option value="monta">Montaña</option>
                        <option value="elec">Electrica</option>
                    </select>
                  </p>
                  <p>
                    <label for="plan">Plan:</label><br>
                    <label>
                        <input type="radio" id="1-hora" name="plan" value="1-hora" required>
                        1 Hora
                    </label><br>
                    <label>
                        <input type="radio" id="medio-dia" name="plan" value="medio-dia" required>
                        Medio dia
                    </label><br>
                    <label>
                        <input type="radio" id="dia-com" name="plan" value="dia-com" required>
                        Dia completo
                    </label>
                  </p>
                    <p>
                        <label for="cantidad">Cantidad de bicicletas:</label>
                        <input type="number" id="cantidad" min="1" max="6" required>
                    </p>
               
                  <p>
                      <label for="guia">Recorrido guiados:</label><br>
                    <label>
                        <input type="checkbox" id="guia">
                        Rios y Parques
                    </label><br>
                    <label>
                        <input type="checkbox" id="guia">
                        Sabores de Rio
                    </label><br>
                    <label>
                        <input type="checkbox" id="guia">
                        Reto las palmas
                    </label><br>
                    <label>
                        <input type="checkbox" id="guia">
                        Ninguno
                    </label>
                  </p>
            </fieldset>
            <fieldset>
                <legend>Confirmacion</legend>
                <p>
                    <label for="comen">Comentarios (maximo 400 caracteres):</label><br>
                    <textarea name="comen" id="comen" maxlength="300" cols="40"></textarea>
                  </p>
                <label >
                    <input type="checkbox" name="cond" id="cond" required>
                    aceptación de las políticas de alquiler.
                </label>
                
            </fieldset>
            <button type="submit" name="boton" >Reservar</button>
        </fieldset>
        </form>
       
  </main><br>
    
    <footer>Rueda libre | hola@ruedalibre.example | 2026</footer>
    
</body>
</html>
