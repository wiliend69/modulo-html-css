name: Desplegar subcarpeta a GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto (Contenido de parche-dev)
        uses: actions/upload-pages-artifact@v3
        with:
          # Al usar './', le decimos a GitHub que tome todo lo que ve 
          # dentro del directorio actual donde está el index.html
          path: './'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4