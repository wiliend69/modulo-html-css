name: Desplegar subcarpeta a GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a master si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto (Solo la subcarpeta)
        uses: actions/upload-pages-artifact@v3
        with:
          # AQUÍ LE DECIMOS A GITHUB QUÉ CARPETA DESPLEGAR
          path: './parche-dev'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4